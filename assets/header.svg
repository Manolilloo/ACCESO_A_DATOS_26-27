<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Acceso a Datos 2026-2027</title>
  <desc id="desc">Banner oscuro con gradientes azul y violeta para el repositorio académico de proyectos de Acceso a Datos.</desc>
  <defs>
